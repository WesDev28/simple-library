<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="displayText"></div>

    <button command="show-modal" commandfor="my-dialog">Open dialog</button>

    <dialog id="my-dialog">
        <p>This dialog was opened using an invoker command.</p>
        <button commandfor="my-dialog" command="close">Close</button>
        <form id="libraryEntry">
            <label for="bookName"> Enter Book: </label>
            <input type="text" id="bookName" required/>

            <label for="bookAuthor"> Enter Author: </label>
            <input type="text" id="bookAuthor" required/>

            <label for="bookPages"> Enter Page Length: </label>
            <input type="number" id="bookPages" required/>

            <label for="bookRead"> Completed?: </label>
            <input type="checkbox" id="bookRead" required/>


        </form>
    </dialog>
    
</body>
</html>
