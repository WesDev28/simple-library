<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="displayText"></div>

        <div class="entryWrapper">
            <button id="openDialogBtn">Click to add a book</button>

            <dialog id="userDialogEntry">

                <form id="libraryEntry">
                    <label for="bookName"> Enter Book: </label>
                    <input type="text" id="bookName" value = "Casino Royale" required/>

                    <label for="bookAuthor"> Enter Author: </label>
                    <input type="text" id="bookAuthor" value = "Ian Fleming" required/>

                    <label for="bookPages"> Enter Page Length: </label>
                    <input type="number" id="bookPages" value=224 required/>

                    <label for="bookRead"> Completed?: </label>
                    <input type="checkbox" id="bookRead"/>

                    <button type ="submit" form="libraryEntry" id="submitBtn">Add book</button>
                
                </form>
                <button id="closeDialogBtn">Close</button>

            </dialog>
        </div>

    </div>

    
</body>
</html>
